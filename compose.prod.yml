# Production Compose — build this app's production Dockerfile (no mise).
#
# Multi-stage Dockerfile: install gems + assets in build stage, slim final
# image with Thruster on port 80. Does not use the sibling *-mise image.
#
# Service name and hostname match this sample (ron).
#
#   SECRET_KEY_BASE=$(bin/rails secret) docker compose -f compose.prod.yml up --build
#   open http://localhost:80   (or HOST_PORT)
#
# Image tag defaults to ron:prod (PROD_IMAGE). Do not reuse IMAGE from
# .env — that is for development (ubuntu-mise:dev).
# Local image only (pull_policy: never).

services:
  ron:
    hostname: ron
    build:
      context: .
      dockerfile: Dockerfile
      # Final stage only (production). No target: development.
      args:
        RUBY_VERSION: ${RUBY_VERSION:-4.0.6}
    image: ${PROD_IMAGE:-ron:prod}
    pull_policy: never
    environment:
      RAILS_ENV: production
      # Prefer SECRET_KEY_BASE for local prod smoke; Kamal uses credentials/master key.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
    ports:
      - "${HOST_PORT:-80}:80"
    # No bind-mount / no /cache — production image is self-contained.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS \"http://127.0.0.1:80/up\" >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
